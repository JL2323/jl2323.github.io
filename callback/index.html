<!doctype html><html><head><meta charset="utf-8"><title>Tesla sign-in code</title></head><body style="font-family:sans-serif;padding:2em">
<h2>Tesla sign-in code</h2><textarea id="c" rows="4" cols="60" readonly></textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Copied'">Copy code</button>
<p>State: <span id="s"></span></p><p id="e" style="color:red"></p>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||'';document.getElementById('s').textContent=p.get('state')||'';if(p.get('error'))document.getElementById('e').textContent=p.get('error')+': '+(p.get('error_description')||'');</script>
</body></html>
